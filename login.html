<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Sign in screen prototype for Ash's Nature Guide."
    />
    <title>Sign in | Ash's Nature Guide</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="login-page">
    <header class="site-header">
      <div class="container nav-wrapper">
        <a href="index.html" class="brand" aria-label="Ash's Nature Guide home">
          Ash's <span>Nature Guide</span>
        </a>
        <a class="login-back-link" href="index.html">Back to the nature guide</a>
      </div>
    </header>

    <main class="login-main">
      <section class="login-card" aria-labelledby="login-title">
        <p class="eyebrow">Welcome back</p>
        <h1 id="login-title">Sign in</h1>
        <p id="login-intro" class="login-intro">
          Sign in to continue exploring with the community.
        </p>

        <div id="auth-form-container">
          <form id="auth-form" class="login-form">
            <label for="email">Email</label>
            <input
              id="email"
              name="email"
              type="email"
              autocomplete="email"
              placeholder="you@example.com"
              required
            />

            <label for="password">Password</label>
            <div class="password-field">
              <input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                placeholder="Your password"
                required
              />
              <button
                id="toggle-password"
                class="password-toggle"
                type="button"
                aria-label="Show password"
                aria-controls="password"
                aria-pressed="false"
              >
                Show
              </button>
            </div>

            <button
              id="auth-submit"
              class="button button-primary login-submit"
              type="submit"
              disabled
            >
              Sign in
            </button>
          </form>
          <button
            id="auth-mode-toggle"
            class="auth-mode-toggle"
            type="button"
            disabled
          >
            New here? Create an account
          </button>
        </div>

        <section id="account-panel" class="account-panel" aria-live="polite" hidden>
          <p>You are signed in as <strong id="account-email"></strong>.</p>
          <button
            id="sign-out"
            class="button button-secondary"
            type="button"
            disabled
          >
            Sign out
          </button>
        </section>

        <p id="login-message" class="login-message" role="status" aria-live="polite">
          Connecting to Supabase Auth...
        </p>

        <a class="login-home-link" href="index.html">Return to Ash's Nature Guide</a>
      </section>
    </main>

    <script src="supabase-config.js"></script>
    <script type="module" src="login.js"></script>
  </body>
</html>
